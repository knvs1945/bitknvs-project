<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Responsive Portrait Video</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- Bootstrap CSS CDN -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background: #111;
      min-height: 100vh;
    }
    .video-container {
      background: #444;
      border-radius: 12px;
      box-shadow: 0 2px 16px rgba(0,0,0,0.5);
      display: flex;
      align-items: center;
      justify-content: center;
      /* Portrait aspect ratio: 9:16 */
      aspect-ratio: 9/16;
      width: 100%;
      max-width: 360px;
      margin: auto;
    }
    @media (min-width: 576px) {
      .video-container {
        max-width: 360px;
      }
    }
    @media (orientation: landscape) and (max-width: 991.98px) {
      .video-container {
        max-width: 320px;
      }
    }
    video {
      width: 100%;
      height: 100%;
      border-radius: 8px;
      object-fit: cover;
      background: #222;
    }
    .center-viewport {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
  </style>
</head>
<body>
  <div class="center-viewport">
    <div class="video-container">
      <video controls>
        <source src="/assets/vids/angel.mp4" type="video/mp4">
        Your browser does not support the video tag.
      </video>
    </div>
  </div>
</body>
</html>
